name: Update profile graphics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/profile-graphics.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate arcade contribution graph
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          games: pacman

      - name: Collect arcade svgs
        run: |
          cp dist/pacman-contribution-graph.svg profile/pacman.svg
          cp dist/pacman-contribution-graph-dark.svg profile/pacman-dark.svg

      - name: Commit graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg profile-3d-contrib/profile-green-animate.svg profile-3d-contrib/profile-night-green.svg
          git commit -m "Update profile graphics" || exit 0
          git push

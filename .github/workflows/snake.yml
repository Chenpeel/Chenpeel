name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ffd33d&color_dots=#ebedf0,#3fb950,#58a6ff,#a371f7,#f778ba
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffd33d&color_dots=#161b22,#3fb950,#58a6ff,#a371f7,#f778ba

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
